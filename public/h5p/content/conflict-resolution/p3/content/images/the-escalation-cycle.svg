<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336" role="img" aria-labelledby="t d">
  <title id="t">The cycle of escalation</title>
  <desc id="d">A line graph of tension over time. It starts low at Calm, rises through Anxious, peaks at Crisis, then falls through Recovery back to calm. The rising Anxious stage is marked as the easiest point to defuse. What to do at each stage: Calm – know their normal and their triggers. Anxious – notice early signs, listen and reassure. Crisis – safety first, give space and get help. Recovery – allow time and calm, do not push too soon.</desc>
  <style>
    .draw { stroke-dasharray: 1; animation: draw 1.6s ease-out both; }
    .pop { animation: pop .4s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .rise { animation: rise .5s ease-out both; }
    .blink { animation: blink 6s step-end infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .bob { animation: bob 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes draw { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
    @keyframes pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: scale(1) } }
    @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.18) } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
    @media (prefers-reduced-motion: reduce) {
      .draw, .pop, .pulse, .rise, .bob, .blink { animation: none }
    }
    text { font-family: Inter, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="604" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset=".33" stop-color="#f59e0b"/>
      <stop offset=".58" stop-color="#dc2626"/>
      <stop offset=".8" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="640" height="336" rx="18" fill="#eff9f2"/>
  <text x="32" y="42" font-size="18" font-weight="700" fill="#16a34a">The cycle of escalation</text>
  <text x="32" y="64" font-size="13" fill="#475569">Every stage is a chance to bring tension back down – the earlier, the easier.</text>

  <!-- axis -->
  <path d="M40 214 V96" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M35 102 L40 94 L45 102" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text transform="translate(30 156) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">TENSION</text>
  <path d="M40 214 H608" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- area + curve -->
  <path d="M48 212 L130 212 C200 212 260 180 300 140 C330 110 345 92 370 92 C400 92 420 120 450 160 C480 195 520 206 604 210 V214 H48 Z" fill="url(#heat)" opacity=".14"/>
  <path class="draw" pathLength="1" d="M48 212 L130 212 C200 212 260 180 300 140 C330 110 345 92 370 92 C400 92 420 120 450 160 C480 195 520 206 604 210" stroke="url(#heat)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- leaders to cards -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 4">
    <path d="M85 220 V238"/><path d="M243 191 V238"/><path d="M370 100 V238"/><path d="M506 205 V238"/>
  </g>

  <!-- stage dots -->
  <g class="pop" style="animation-delay:.3s"><circle cx="85" cy="212" r="11" fill="#fff" stroke="#16a34a" stroke-width="4"/><text x="85" y="216.5" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">1</text></g>
  <g class="pop" style="animation-delay:.7s"><circle cx="243" cy="183" r="11" fill="#fff" stroke="#f59e0b" stroke-width="4"/><text x="243" y="187.5" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">2</text></g>
  <g class="pop" style="animation-delay:1.1s"><g class="pulse"><circle cx="370" cy="92" r="11" fill="#fff" stroke="#dc2626" stroke-width="4"/><text x="370" y="96.5" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">3</text></g></g>
  <g class="pop" style="animation-delay:1.5s"><circle cx="506" cy="197" r="11" fill="#fff" stroke="#f59e0b" stroke-width="4"/><text x="506" y="201.5" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">4</text></g>

  <!-- "step in here" callout -->
  <g class="rise" style="animation-delay:1.8s">
    <rect x="130" y="104" width="138" height="30" rx="15" fill="#16a34a"/>
    <text x="199" y="123.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Easiest to defuse</text>
    <path d="M222 134 L236 168" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M228 164 L237 171 L240 160" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- carer, calm and reassuring, open palm, beside recovery -->
  <g transform="translate(570 160)">
    <g class="bob">
      <!-- hair behind -->
      <path d="M-17 -14 C-19 -36 19 -36 17 -14 L18 3 C11 7 -11 7 -18 3 Z" fill="#2d1f16"/>
      <!-- neck -->
      <path d="M-6 2 h12 v11 c-3 3 -9 3 -12 0z" fill="#c68642"/>
      <path d="M-6 2 h12 v4 q-6 3.5 -12 0z" fill="#a86b32"/>
      <!-- tunic -->
      <path d="M-30 40 C-30 22 -21 13 -8 12 L0 21 L8 12 C21 13 30 22 30 40 Z" fill="#16a34a"/>
      <path d="M-7 11.5 L0 20 L7 11.5 Z" fill="#c68642"/>
      <path d="M-9 12 L0 22.5 L9 12" stroke="#0f7a37" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <path d="M0 22.5 V40" stroke="#0f7a37" stroke-width="1.2" opacity=".5"/>
      <!-- name badge -->
      <rect x="10" y="24" width="12" height="8.5" rx="1.8" fill="#fff"/>
      <rect x="12" y="26.5" width="8" height="1.6" rx=".8" fill="#16a34a"/>
      <rect x="12" y="29.3" width="5.5" height="1.4" rx=".7" fill="#cbd5e1"/>
      <!-- relaxed arm, open palm held low -->
      <path d="M-22 20 L-28 33 L-33 33" stroke="#138a3e" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(4 0)">
      <path d="M-35 33 H-40" stroke="#c68642" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M-40 30 C-44 29.5 -49 30 -50.5 31.5 C-51 33.5 -47 36.5 -42 36.5 C-39.5 36.5 -38 35 -38.5 32.5 Z" fill="#c68642"/>
      <path d="M-41 30.2 C-41.5 27.8 -43.5 26.8 -45 27.6" stroke="#c68642" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M-48.5 32 C-46 33 -43 33.2 -40.5 32.6" stroke="#a86b32" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".7"/>
      </g>
      <!-- head -->
      <ellipse cx="-15" cy="-13" rx="3" ry="4.5" fill="#b8793a"/>
      <ellipse cx="15" cy="-13" rx="3" ry="4.5" fill="#b8793a"/>
      <ellipse cx="0" cy="-14" rx="15" ry="17" fill="#c68642"/>
      <!-- fringe -->
      <path d="M-16 -15 C-17.5 -32 -5 -36.5 4 -33.5 C12.5 -32 17.5 -25 16 -15 C13 -23.5 5 -26.5 -5 -24.5 C-10 -23 -13.5 -19.5 -16 -15 Z" fill="#2d1f16"/>
      <!-- face: soft, attentive -->
      <path d="M-10.5 -19.5 q3.8 -2.2 7 -0.6 M3.5 -20.1 q3.2 -1.6 7 0.6" stroke="#2d1f16" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <g class="blink">
        <ellipse cx="-6.5" cy="-14" rx="1.9" ry="2.3" fill="#1f2937"/>
        <ellipse cx="6.5" cy="-14" rx="1.9" ry="2.3" fill="#1f2937"/>
        <circle cx="-5.8" cy="-14.8" r=".7" fill="#fff"/>
        <circle cx="7.2" cy="-14.8" r=".7" fill="#fff"/>
      </g>
      <path d="M0.5 -12 q1.8 3.8 -1.2 4.6" stroke="#a86b32" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M-4.2 -3.6 q4.2 3 8.4 0" stroke="#7c2d12" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <circle cx="-10" cy="-6.5" r="3" fill="#f87171" opacity=".22"/>
      <circle cx="10" cy="-6.5" r="3" fill="#f87171" opacity=".22"/>
    </g>
  </g>
  <g class="rise" style="animation-delay:2s">
    <rect x="474" y="72" width="140" height="40" rx="12" fill="#fff" stroke="#96d6ae" stroke-width="2"/>
    <path d="M562 111 l6 9 l4 -9" fill="#fff" stroke="#96d6ae" stroke-width="2" stroke-linejoin="round"/>
    <path d="M560 110 h14" stroke="#fff" stroke-width="3"/>
    <text x="544" y="89" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">“I’m here. Take</text>
    <text x="544" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">your time.”</text>
  </g>

  <!-- stage cards -->
  <g class="rise" style="animation-delay:.4s" transform="translate(28 238)">
    <rect width="134" height="80" rx="12" fill="#fff" stroke="#96d6ae" stroke-width="2"/>
    <rect x="12" y="11" width="28" height="4" rx="2" fill="#16a34a"/>
    <text x="12" y="34" font-size="14" font-weight="700" fill="#15803d">1  Calm</text>
    <text x="12" y="52" font-size="12" fill="#334155">Know their normal</text>
    <text x="12" y="67" font-size="12" fill="#334155">and their triggers</text>
  </g>
  <g class="rise" style="animation-delay:.8s" transform="translate(174 238)">
    <rect width="134" height="80" rx="12" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <rect x="12" y="11" width="28" height="4" rx="2" fill="#f59e0b"/>
    <text x="12" y="34" font-size="14" font-weight="700" fill="#b45309">2  Anxious</text>
    <text x="12" y="52" font-size="12" fill="#334155">Notice early signs.</text>
    <text x="12" y="67" font-size="12" fill="#334155">Listen, reassure</text>
  </g>
  <g class="rise" style="animation-delay:1.2s" transform="translate(320 238)">
    <rect width="134" height="80" rx="12" fill="#fff" stroke="#fca5a5" stroke-width="2"/>
    <rect x="12" y="11" width="28" height="4" rx="2" fill="#dc2626"/>
    <text x="12" y="34" font-size="14" font-weight="700" fill="#b91c1c">3  Crisis</text>
    <text x="12" y="52" font-size="12" fill="#334155">Safety first. Give</text>
    <text x="12" y="67" font-size="12" fill="#334155">space, get help</text>
  </g>
  <g class="rise" style="animation-delay:1.6s" transform="translate(466 238)">
    <rect width="134" height="80" rx="12" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <rect x="12" y="11" width="28" height="4" rx="2" fill="#f59e0b"/>
    <text x="12" y="34" font-size="14" font-weight="700" fill="#b45309">4  Recovery</text>
    <text x="12" y="52" font-size="12" fill="#334155">Allow time and calm.</text>
    <text x="12" y="67" font-size="12" fill="#334155">Don’t push too soon</text>
  </g>
</svg>
